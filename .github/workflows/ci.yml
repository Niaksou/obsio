name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Mêmes services et même initialisation des rôles qu'en local.
      - name: Services (PostgreSQL, Redis)
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis storage

      - name: Tests
        run: pnpm test

  images:
    name: Images de production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vérifie seulement que les trois images se construisent (rien n'est publié).
      - name: Build api, worker, web
        run: |
          for target in api worker web; do
            docker build --target "$target" --build-arg VITE_API_URL=https://preprod.example.test .
          done
