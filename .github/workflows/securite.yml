name: Sécurité

# Garde-fous automatiques de docs/securite.md (OWASP ASVS niveau 2).
on:
  push:
    branches: [main]
  pull_request:
  # Chaque lundi : une faille peut être publiée sur une dépendance qui n'a pas changé.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: securite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependances:
    name: Failles connues des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # Ce qui part en production : aucune faille tolérée à partir de « modérée ».
      - name: Dépendances de production
        run: pnpm audit --prod --audit-level moderate

      # Outils de développement (build, lint, tests) : seules les failles élevées bloquent.
      - name: Toutes les dépendances
        run: pnpm audit --audit-level high

  secrets:
    name: Secrets dans l'historique
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Faux positifs : .gitleaksignore (empreinte de chaque alerte).
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose --gitleaks-ignore-path /repo/.gitleaksignore

  analyse-statique:
    name: Analyse statique (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: semgrep/semgrep:1.136.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Faux positifs : commentaire `// nosemgrep: <règle>` avec la raison, sur la ligne visée.
      # Règles pnpm écartées : réglages de pnpm 10, pas encore adopté (écart noté dans
      # docs/securite.md).
      - name: Semgrep
        run: >
          semgrep scan --error --metrics=off
          --config p/owasp-top-ten --config p/typescript --config p/nodejs
          --config p/react --config p/dockerfile
          --exclude fixtures
          --exclude-rule package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies
          --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
          --exclude-rule package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy

  sbom:
    name: Inventaire des composants (SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # CycloneDX, d'après pnpm-lock.yaml : à fournir à un client ou à confronter à une faille
      # publiée (ASVS 15.1.2). Conservé 90 jours avec chaque passage.
      - name: Syft
        run: >
          docker run --rm -v "$PWD:/src:ro" anchore/syft:v1.33.0
          scan dir:/src --exclude './fixtures/**' --exclude './**/node_modules/**'
          -o cyclonedx-json > obsio-sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: obsio-sbom.cdx.json
          retention-days: 90
