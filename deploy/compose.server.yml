# Serveur (VPS) : s'ajoute à deploy/compose.yml. Un proxy Caddy prend les ports 80 et 443 et
# obtient les certificats ; l'application et le stockage ne sont plus exposés directement.
# Les e-mails partent par un vrai SMTP (Mailpit désactivé) ; la base est sauvegardée chaque jour.
# Variables : deploy/server.env (modèle : deploy/server.env.example). Guide : docs/deploiement.md
#
#   docker compose -f deploy/compose.yml -f deploy/compose.server.yml --env-file deploy/server.env up -d --build --wait

# Redémarrage automatique, et journaux Docker étiquetés du nom du conteneur (lu par le service
# journaux) et limités à 5 fichiers de 10 Mo par conteneur.
x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      tag: '{{.Name}}'
      max-size: 10m
      max-file: '5'

services:
  proxy:
    image: caddy:2.10-alpine
    <<: *restart
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ['/tmp']
    pids_limit: 200
    mem_limit: 256m
    environment:
      APP_HOST: ${APP_HOST}
      STORAGE_HOST: ${STORAGE_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    # Autorité interne : le proxy joint l'application et le stockage en HTTPS (ASVS 12.3.3).
    secrets: [tls_ca]
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # L'API et le worker joignent le stockage par son adresse publique, sans sortir du serveur.
        aliases: ['${STORAGE_HOST}']

  postgres: *restart
  redis: *restart

  # Stockage en HTTPS seulement, derrière le proxy (certificat de l'autorité interne).
  storage:
    <<: *restart
    ports: !reset []
    environment:
      RUSTFS_TLS_PATH: /tls
    secrets:
      - source: tls_storage_cert
        target: /tls/rustfs_cert.pem
      - source: tls_storage_key
        target: /tls/rustfs_key.pem

  # Sans Brevo seulement (COMPOSE_PROFILES=local) : messages conservés d'un redémarrage à l'autre.
  mailpit:
    <<: *restart
    profiles: [local]
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

  setup:
    depends_on:
      proxy: { condition: service_started }

  clamav: *restart
  api: *restart
  worker: *restart

  # Le proxy joint le port HTTPS (8443) ; le port HTTP n'écoute que dans le conteneur.
  web:
    <<: *restart
    ports: !reset []
    environment:
      HTTP_BIND: 127.0.0.1

  # Sauvegarde chaque nuit à 3 h : la base dans BACKUP_DIR (sept jours), puis, si
  # OFFSITE_REPOSITORY est renseigné, la base et une copie du bucket chiffrées par restic vers un
  # stockage objet hors du serveur (OVH Object Storage), e-mail à OPERATOR_EMAIL en cas d'échec.
  # Script : deploy/server/backup/backup.sh ; restauration : docs/deploiement.md.
  backup:
    build: { context: ./server/backup }
    image: obsio-backup:preprod
    <<: *restart
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp']
    mem_limit: 512m
    environment:
      TZ: Europe/Paris
      HOME: /tmp
      PGHOST: postgres
      PGUSER: postgres
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/tls_ca
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      OFFSITE_REPOSITORY: ${OFFSITE_REPOSITORY:-}
      OFFSITE_REGION: ${OFFSITE_REGION:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER:-}
      MAIL_FROM: ${MAIL_FROM}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL}
      APP_HOST: ${APP_HOST}
    secrets:
      - postgres_password
      - tls_ca
      - s3_backup_access_key
      - s3_backup_secret_key
      - restic_password
      - offsite_access_key
      - offsite_secret_key
      - smtp_password
    volumes:
      - ${BACKUP_DIR:-/var/backups/obsio}:/backups
      - backup-cache:/cache
    depends_on:
      postgres: { condition: service_healthy }
      setup: { condition: service_completed_successfully }

  # Journaux envoyés à Better Stack (UE), hors du serveur et non modifiables depuis lui
  # (COMPOSE_PROFILES=journaux, voir docs/deploiement.md). Lecture seule des fichiers de Docker,
  # sans le socket Docker, qui donnerait la main sur tous les conteneurs.
  journaux:
    image: timberio/vector:0.51.1-alpine
    <<: *restart
    profiles: [journaux]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    mem_limit: 256m
    environment:
      BETTERSTACK_HOST: ${BETTERSTACK_HOST:-}
    secrets: [betterstack_token]
    volumes:
      - ./server/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - vector-data:/var/lib/vector

volumes:
  caddy-data:
  caddy-config:
  mailpit-data:
  vector-data:
  backup-cache:

secrets:
  tls_storage_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_storage_cert
  tls_storage_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_storage_key
  betterstack_token:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/betterstack_token
  restic_password:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/restic_password
  offsite_access_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/offsite_access_key
  offsite_secret_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/offsite_secret_key
