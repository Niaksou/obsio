# Serveur (VPS) : s'ajoute à deploy/compose.yml. Un proxy Caddy prend les ports 80 et 443 et
# obtient les certificats ; l'application et le stockage ne sont plus exposés directement.
# Les e-mails partent par un vrai SMTP (Mailpit désactivé) ; la base est sauvegardée chaque jour.
# Variables : deploy/server.env (modèle : deploy/server.env.example). Guide : docs/deploiement.md
#
#   docker compose -f deploy/compose.yml -f deploy/compose.server.yml --env-file deploy/server.env up -d --build --wait

# Redémarrage automatique, et journaux Docker étiquetés du nom du conteneur (lu par le service
# journaux) et limités à 5 fichiers de 10 Mo par conteneur.
x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      tag: '{{.Name}}'
      max-size: 10m
      max-file: '5'

services:
  proxy:
    image: caddy:2.10-alpine
    <<: *restart
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ['/tmp']
    pids_limit: 200
    mem_limit: 256m
    environment:
      APP_HOST: ${APP_HOST}
      STORAGE_HOST: ${STORAGE_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # L'API et le worker joignent le stockage par son adresse publique, sans sortir du serveur.
        aliases: ['${STORAGE_HOST}']

  postgres: *restart
  redis: *restart

  storage:
    <<: *restart
    ports: !reset []

  # Sans Brevo seulement (COMPOSE_PROFILES=local) : messages conservés d'un redémarrage à l'autre.
  mailpit:
    <<: *restart
    profiles: [local]
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

  setup:
    depends_on:
      proxy: { condition: service_started }

  clamav: *restart
  api: *restart
  worker: *restart

  web:
    <<: *restart
    ports: !reset []

  # Sauvegarde quotidienne de la base dans BACKUP_DIR, sept jours conservés.
  backup:
    image: postgres:17-alpine
    <<: *restart
    environment:
      PGHOST: postgres
      PGUSER: postgres
    secrets: [postgres_password]
    volumes:
      - ${BACKUP_DIR:-/var/backups/obsio}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint:
      - sh
      - -c
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        while true; do
          file=/backups/obsio-$$(date +%F).dump
          pg_dump -Fc obsio > "$$file.tmp" && mv "$$file.tmp" "$$file" && echo "Sauvegarde : $$file"
          find /backups -name 'obsio-*.dump' -mtime +7 -delete
          sleep 86400
        done

  # Journaux envoyés à Better Stack (UE), hors du serveur et non modifiables depuis lui
  # (COMPOSE_PROFILES=journaux, voir docs/deploiement.md). Lecture seule des fichiers de Docker,
  # sans le socket Docker, qui donnerait la main sur tous les conteneurs.
  journaux:
    image: timberio/vector:0.51.1-alpine
    <<: *restart
    profiles: [journaux]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    mem_limit: 256m
    environment:
      BETTERSTACK_HOST: ${BETTERSTACK_HOST:-}
    secrets: [betterstack_token]
    volumes:
      - ./server/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - vector-data:/var/lib/vector

volumes:
  caddy-data:
  caddy-config:
  mailpit-data:
  vector-data:

secrets:
  betterstack_token:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/betterstack_token
