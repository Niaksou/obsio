# Accès à PostgreSQL en déploiement (deploy/compose.yml).
# Dans le conteneur, par la socket Unix : initialisation et contrôle de santé.
local   all   all                 trust
# Par le réseau : TLS obligatoire (ASVS 12.3.3), mot de passe SCRAM. Sans TLS, aucune règle ne
# correspond : la connexion est refusée.
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::/0          scram-sha-256
