# Préproduction autonome : toute l'application et ses services sur une machine, derrière une
# seule origine publique (Caddy). Les variables viennent de deploy/preprod.env
# (modèle : deploy/preprod.env.example).
#
#   docker compose -f deploy/compose.yml --env-file deploy/preprod.env up -d --build --wait
#
# Chez un hébergeur (Scaleway, Clever Cloud, OVH), PostgreSQL, Redis et le stockage S3 sont
# remplacés par les services managés : seules les images api, worker et web sont déployées.
name: obsio-preprod

# Secrets : un fichier par secret dans SECRETS_DIR (deploy/secrets.sh), monté dans
# /run/secrets/<nom> des seuls services qui en ont besoin et lu par NOM_FILE (ASVS 13.3.1).
# Aucun secret dans l'environnement déclaré des conteneurs ni dans le fichier de variables.
x-common-env: &common-env
  NODE_ENV: production
  # Autorité interne : PostgreSQL, Redis et l'API présentent un certificat qu'elle a signé.
  NODE_EXTRA_CA_CERTS: /run/secrets/tls_ca
  REDIS_URL_FILE: /run/secrets/redis_url
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
  S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
  S3_FORCE_PATH_STYLE: 'true'

x-api-env: &api-env
  <<: *common-env
  DATABASE_URL_FILE: /run/secrets/database_url
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  MAIL_FROM: ${MAIL_FROM}
  API_PORT: 3000
  TRUST_PROXY: 'true'
  API_URL: ${PUBLIC_URL}
  WEB_URL: ${PUBLIC_URL}
  OPERATOR_EMAIL: ${OPERATOR_EMAIL}
  OPERATOR_NAME: ${OPERATOR_NAME}
  BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
  VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
  CLAMAV_SOCKET: /run/clamav/clamd.sock

# Rôle propriétaire de la base : migrations et commandes de l'éditeur (service setup) seulement,
# jamais l'API ni le worker, qui n'en ont pas besoin (moindre privilège, ASVS 13.2.2).
# Même chose pour le compte principal du stockage : l'API et le worker ont un compte limité au
# bucket (S3_ACCESS_KEY), créé par setup.
x-owner-env: &owner-env
  <<: *api-env
  DATABASE_OWNER_URL_FILE: /run/secrets/database_owner_url
  S3_ADMIN_ACCESS_KEY_FILE: /run/secrets/s3_admin_access_key
  S3_ADMIN_SECRET_KEY_FILE: /run/secrets/s3_admin_secret_key

# Conteneurs de l'application : aucune capacité Linux, système de fichiers en lecture seule,
# mémoire et nombre de processus bornés.
# Flux internes chiffrés (ASVS 12.3.3) : PostgreSQL, Redis et l'API n'acceptent que TLS, avec un
# certificat par service signé par l'autorité interne (deploy/secrets.sh). ClamAV, qui ne
# connaît pas TLS, n'écoute que dans son conteneur et sur une socket Unix partagée avec l'API.
x-locked: &locked
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  read_only: true
  tmpfs: ['/tmp']
  pids_limit: 200

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_OWNER_PASSWORD_FILE: /run/secrets/app_owner_password
      APP_USER_PASSWORD_FILE: /run/secrets/app_user_password
    secrets:
      - postgres_password
      - app_owner_password
      - app_user_password
      - tls_postgres_cert
      - tls_postgres_key
    # PostgreSQL exige une clé lisible par lui seul : copie privée avant le démarrage.
    command:
      - sh
      - -c
      - >-
        install -D -m 600 -o postgres -g postgres /run/secrets/tls_postgres_key
        /var/lib/postgresql/tls/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on -c ssl_min_protocol_version=TLSv1.2
        -c ssl_cert_file=/run/secrets/tls_postgres_cert
        -c ssl_key_file=/var/lib/postgresql/tls/server.key
        -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/postgres:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d obsio']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    # Mot de passe exigé, même sur le réseau interne (ASVS 13.2.1), et TLS seulement : le port
    # en clair est fermé (--port 0). Le script de l'image lance Redis sous son utilisateur.
    command:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh redis-server --maxmemory-policy noeviction --appendonly yes
        --requirepass "$$(cat /run/secrets/redis_password)"
        --port 0 --tls-port 6379 --tls-auth-clients no --tls-protocols "TLSv1.2 TLSv1.3"
        --tls-cert-file /run/secrets/tls_redis_cert --tls-key-file /run/secrets/tls_redis_key
        --tls-ca-cert-file /run/secrets/tls_ca
    secrets: [redis_password, tls_ca, tls_redis_cert, tls_redis_key]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --tls --cacert /run/secrets/tls_ca -h localhost ping
      interval: 2s
      timeout: 3s
      retries: 30

  # Le navigateur envoie les fichiers directement au stockage (URL signées) : son adresse doit
  # être la même pour le navigateur et pour l'API. « storage.localhost » pointe vers le poste
  # dans le navigateur, et vers ce conteneur depuis les autres.
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/s3_admin_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/s3_admin_secret_key
      # Même port dedans et dehors, pour que l'adresse signée soit identique partout.
      RUSTFS_ADDRESS: ':${STORAGE_PORT:-9100}'
    secrets: [s3_admin_access_key, s3_admin_secret_key]
    ports:
      - '${STORAGE_PORT:-9100}:${STORAGE_PORT:-9100}'
    networks:
      default:
        aliases: [storage.localhost]
    volumes:
      - storage-data:/data

  # Antivirus des fichiers déposés (ASVS 5.4.3), interrogé par l'API à chaque dépôt. Signatures
  # mises à jour par freshclam dans le conteneur, gardées dans un volume ; le premier démarrage
  # les télécharge (quelques minutes).
  clamav:
    image: clamav/clamav-debian:1.4
    environment:
      # Plus grand fichier accepté : 50 Mo (rapport, plan d'origine).
      CLAMD_CONF_StreamMaxLength: 60M
      # Rechargement des signatures sans doubler la mémoire (environ 1 Go au lieu de 2).
      CLAMD_CONF_ConcurrentDatabaseReload: 'no'
      # Socket Unix dans un volume partagé avec l'API seule (même groupe, 1000) ; le port TCP
      # n'écoute que dans le conteneur, pour son contrôle de santé.
      CLAMD_CONF_LocalSocketGroup: clamav
      CLAMD_CONF_LocalSocketMode: '660'
      CLAMD_CONF_TCPAddr: 127.0.0.1
    # L'image ne remplace que les options commentées : la socket est déplacée ici.
    entrypoint:
      - sh
      - -c
      - >-
        sed -i 's|^LocalSocket .*|LocalSocket /run/clamav/clamd.sock|' /etc/clamav/clamd.conf &&
        chown clamav:clamav /run/clamav && exec /init
    security_opt: ['no-new-privileges:true']
    mem_limit: 1536m
    volumes:
      - clamav-data:/var/lib/clamav
      - clamav-socket:/run/clamav

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - '${MAILPIT_PORT:-8125}:8025'

  # Migrations et bucket, avant le démarrage de l'API. Sert aussi aux commandes de l'éditeur qui
  # demandent le rôle propriétaire (suppression d'une organisation) : docker compose run --rm setup …
  setup:
    build: { context: .., target: api, args: { VITE_API_URL: '${PUBLIC_URL}' } }
    image: obsio-api:preprod
    environment: *owner-env
    secrets:
      - tls_ca
      - database_url
      - database_owner_url
      - redis_url
      - s3_access_key
      - s3_secret_key
      - s3_admin_access_key
      - s3_admin_secret_key
      - smtp_password
      - better_auth_secret
      - vapid_private_key
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/cli/setup-storage.js']
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_started }
    restart: on-failure

  api:
    <<: *locked
    image: obsio-api:preprod
    environment:
      <<: *api-env
      TLS_CERT_FILE: /run/secrets/tls_api_cert
      TLS_KEY_FILE: /run/secrets/tls_api_key
    secrets:
      - database_url
      - redis_url
      - s3_access_key
      - s3_secret_key
      - smtp_password
      - better_auth_secret
      - vapid_private_key
      - tls_ca
      - tls_api_cert
      - tls_api_key
    volumes:
      - clamav-socket:/run/clamav
    mem_limit: 512m
    depends_on:
      setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('https://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *locked
    build: { context: .., target: worker, args: { VITE_API_URL: '${PUBLIC_URL}' } }
    environment:
      <<: *common-env
      MISTRAL_API_KEY_FILE: /run/secrets/mistral_api_key
    secrets: [tls_ca, redis_url, s3_access_key, s3_secret_key, mistral_api_key]
    mem_limit: 1g
    depends_on:
      redis: { condition: service_healthy }
      setup: { condition: service_completed_successfully }

  web:
    <<: *locked
    build: { context: .., target: web, args: { VITE_API_URL: '${PUBLIC_URL}' } }
    environment:
      STORAGE_ORIGIN: ${S3_ENDPOINT}
    secrets: [tls_ca, tls_web_cert, tls_web_key]
    # Le binaire de Caddy porte cette capacité : sans elle, il refuse de démarrer.
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ['/tmp', '/config', '/data']
    mem_limit: 256m
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  storage-data:
  clamav-data:
  clamav-socket:

# Fichiers créés par deploy/secrets.sh (dossier lisible par root seulement sur le serveur).
secrets:
  postgres_password:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/postgres_password
  app_owner_password:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/app_owner_password
  app_user_password:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/app_user_password
  database_url:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/database_url
  database_owner_url:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/database_owner_url
  redis_password:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/redis_password
  redis_url:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/redis_url
  s3_admin_access_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/s3_admin_access_key
  s3_admin_secret_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/s3_admin_secret_key
  s3_access_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/s3_access_key
  s3_secret_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/s3_secret_key
  smtp_password:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/smtp_password
  better_auth_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/better_auth_secret
  vapid_private_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/vapid_private_key
  mistral_api_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/mistral_api_key
  tls_ca:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_ca
  tls_postgres_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_postgres_cert
  tls_postgres_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_postgres_key
  tls_redis_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_redis_cert
  tls_redis_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_redis_key
  tls_api_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_api_cert
  tls_api_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_api_key
  tls_web_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_web_cert
  tls_web_key:
    file: ${SECRETS_DIR:?SECRETS_DIR manquant}/tls_web_key
