# Préproduction autonome : toute l'application et ses services sur une machine, derrière une
# seule origine publique (Caddy). Les variables viennent de deploy/preprod.env
# (modèle : deploy/preprod.env.example).
#
#   docker compose -f deploy/compose.yml --env-file deploy/preprod.env up -d --build --wait
#
# Chez un hébergeur (Scaleway, Clever Cloud, OVH), PostgreSQL, Redis et le stockage S3 sont
# remplacés par les services managés : seules les images api, worker et web sont déployées.
name: obsio-preprod

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD}@postgres:5432/obsio
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM}
  API_PORT: 3000
  TRUST_PROXY: 'true'
  API_URL: ${PUBLIC_URL}
  WEB_URL: ${PUBLIC_URL}
  OPERATOR_EMAIL: ${OPERATOR_EMAIL}
  OPERATOR_NAME: ${OPERATOR_NAME}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

# Rôle propriétaire de la base : migrations et commandes de l'éditeur (service setup) seulement,
# jamais l'API ni le worker, qui n'en ont pas besoin (moindre privilège, ASVS 13.2.2).
# Même chose pour le compte principal du stockage : l'API et le worker ont un compte limité au
# bucket (S3_ACCESS_KEY), créé par setup.
x-owner-env: &owner-env
  <<: *app-env
  DATABASE_OWNER_URL: postgres://app_owner:${APP_OWNER_PASSWORD}@postgres:5432/obsio
  S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?S3_ADMIN_ACCESS_KEY manquant}
  S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?S3_ADMIN_SECRET_KEY manquant}

# Conteneurs de l'application : aucune capacité Linux, système de fichiers en lecture seule,
# mémoire et nombre de processus bornés.
x-locked: &locked
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  read_only: true
  tmpfs: ['/tmp']
  pids_limit: 200

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d obsio']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    # Mot de passe exigé, même sur le réseau interne (ASVS 13.2.1).
    command:
      - sh
      - -c
      - exec redis-server --maxmemory-policy noeviction --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Le navigateur envoie les fichiers directement au stockage (URL signées) : son adresse doit
  # être la même pour le navigateur et pour l'API. « storage.localhost » pointe vers le poste
  # dans le navigateur, et vers ce conteneur depuis les autres.
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_ADMIN_SECRET_KEY}
      # Même port dedans et dehors, pour que l'adresse signée soit identique partout.
      RUSTFS_ADDRESS: ':${STORAGE_PORT:-9100}'
    ports:
      - '${STORAGE_PORT:-9100}:${STORAGE_PORT:-9100}'
    networks:
      default:
        aliases: [storage.localhost]
    volumes:
      - storage-data:/data

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - '${MAILPIT_PORT:-8125}:8025'

  # Migrations et bucket, avant le démarrage de l'API. Sert aussi aux commandes de l'éditeur qui
  # demandent le rôle propriétaire (suppression d'une organisation) : docker compose run --rm setup …
  setup:
    build: { context: .., target: api, args: { VITE_API_URL: '${PUBLIC_URL}' } }
    image: obsio-api:preprod
    environment: *owner-env
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/cli/setup-storage.js']
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_started }
    restart: on-failure

  api:
    <<: *locked
    image: obsio-api:preprod
    environment: *app-env
    mem_limit: 512m
    depends_on:
      setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *locked
    build: { context: .., target: worker, args: { VITE_API_URL: '${PUBLIC_URL}' } }
    environment: *app-env
    mem_limit: 1g
    depends_on:
      redis: { condition: service_healthy }
      setup: { condition: service_completed_successfully }

  web:
    <<: *locked
    build: { context: .., target: web, args: { VITE_API_URL: '${PUBLIC_URL}' } }
    environment:
      STORAGE_ORIGIN: ${S3_ENDPOINT}
    # Le binaire de Caddy porte cette capacité : sans elle, il refuse de démarrer.
    cap_add: [NET_BIND_SERVICE]
    tmpfs: ['/tmp', '/config', '/data']
    mem_limit: 256m
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  storage-data:
