// Mises à jour automatiques : copié dans /etc/apt/apt.conf.d/52obsio par install.sh.
Unattended-Upgrade::Origins-Pattern {
  "origin=Docker";
};
// Redémarrage à 4 h quand une mise à jour du noyau l'exige ; les conteneurs repartent seuls.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:00";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
