# SSH : clé uniquement, jamais root, algorithmes récents (dont l'échange de clés post-quantique).
# Copié dans /etc/ssh/sshd_config.d/00-obsio.conf par install.sh, qui ajoute AllowUsers.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey
MaxAuthTries 3
MaxSessions 2
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no
X11Forwarding no
AllowAgentForwarding no
# Le tunnel vers Mailpit (ssh -L) reste possible ; pas de redirection depuis le serveur.
AllowTcpForwarding local
PermitTunnel no
GatewayPorts no
LogLevel VERBOSE
Banner /etc/issue.net
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com
PubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com
